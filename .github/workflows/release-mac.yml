name: Mac app

# A tag like v0.3.0 builds the Mac app (Apple silicon) and attaches the .dmg and .zip to a
# GitHub release. A change to this file on main builds it without releasing (a test run).
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/release-mac.yml']
  workflow_dispatch:

permissions:
  contents: write # (to create the release; nothing else)

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip # (no GPU download on a Mac)
        run: npm ci --no-audit --no-fund

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: npm version --no-git-tag-version --allow-same-version "${TAG#v}"

      - name: Build
        env:
          # (no Apple Developer ID here: ad-hoc signed, so Apple silicon runs it, but not notarized)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --arm64 --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false

      - name: Check the app
        run: |
          app="$(ls -d dist/mac-arm64/*.app | head -1)"
          codesign --verify --deep --strict "$app" && echo "signature ok (ad-hoc)"
          ls -lh dist/*.dmg dist/*.zip
          shasum -a 256 dist/*.dmg dist/*.zip | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 14

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          **Mac (Apple silicon, M1 and later):** download the `.dmg`, open it and drag MCP Browser to Applications.

          This build isn't notarized by Apple (there's no paid Developer ID behind it), so macOS blocks it the first time. Open it once, then go to **System Settings → Privacy & Security** and press **Open Anyway** next to "MCP Browser was blocked". (Or, in Terminal: `xattr -dr com.apple.quarantine "/Applications/MCP Browser.app"`.) Check the download against `SHA256SUMS.txt` if you like.

          Intel Macs, Windows and Linux: run from source (`npm install`, then `npm run desktop`); see the README.
          EOF
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.dmg dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.dmg dist/*.zip dist/SHA256SUMS.txt --title "MCP Browser ${TAG#v}" --notes-file notes.md --generate-notes
          fi
