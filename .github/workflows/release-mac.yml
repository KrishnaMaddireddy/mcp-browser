name: Mac app

# A tag like v0.3.0 builds the Mac app (Apple silicon) and attaches the .dmg and .zip to a
# GitHub release. So does running this workflow by hand with "release" ticked: the release
# is tagged v<version in package.json> at that commit. A change to this file on main, or a
# run by hand without "release", builds it without releasing (a test run).
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/release-mac.yml']
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release tagged v<version in package.json>
        type: boolean
        default: false

# (the build reads only; the release job, which installs nothing, is the one that can write)
permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # (no token left in .git for install scripts to find)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip # (no GPU download on a Mac)
        run: npm ci --no-audit --no-fund

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: npm version --no-git-tag-version --allow-same-version "${TAG#v}"

      - name: Release tag
        id: tag
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          # (no Apple Developer ID here: ad-hoc signed, so Apple silicon runs it, but not notarized)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --arm64 --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false '-c.artifactName=MCP-Browser-${version}-${arch}.${ext}'

      - name: Check the app
        run: |
          app="$(ls -d dist/mac-arm64/*.app | head -1)"
          codesign --verify --deep --strict "$app" && echo "signature ok (ad-hoc)"
          ls -lh dist/*.dmg dist/*.zip
          (cd dist && shasum -a 256 *.dmg *.zip | tee SHA256SUMS.txt)

      - name: Open the app once
        # (the packaged app starts, its local server answers, and it can list servers)
        run: |
          app="$(ls -d dist/mac-arm64/*.app | head -1)"
          export MCPB_DATA_DIR="$RUNNER_TEMP/mcpb-smoke" PORT=7799
          "$app/Contents/MacOS/MCP Browser" > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!
          ok=
          for i in $(seq 1 60); do
            if curl -sf -H 'x-mcpb: 1' "http://127.0.0.1:$PORT/api/templates" > /dev/null; then ok=1; break; fi
            sleep 1
          done
          kill $pid 2>/dev/null || true
          if [ -z "$ok" ]; then echo "::error::The app didn't start"; tail -40 "$RUNNER_TEMP/app.log"; exit 1; fi
          echo "the app started and answered"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write # (to create the release; nothing else)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac-arm64
          path: dist

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          cat > notes.md <<'EOF'
          **Mac (Apple silicon, M1 and later):** download the `.dmg`, open it and drag MCP Browser to Applications.

          This build isn't notarized by Apple (there's no paid Developer ID behind it), so macOS blocks it the first time. Open it once, then go to **System Settings → Privacy & Security** and press **Open Anyway** next to "MCP Browser was blocked". (Or, in Terminal: `xattr -dr com.apple.quarantine "/Applications/MCP Browser.app"`.) To check a download: `shasum -a 256 -c SHA256SUMS.txt --ignore-missing` in the folder you saved it to.

          Intel Macs, Windows and Linux: run from source (`npm install`, then `npm run desktop`); see the README.
          EOF
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.dmg dist/*.zip dist/SHA256SUMS.txt --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.dmg dist/*.zip dist/SHA256SUMS.txt  -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "MCP Browser ${TAG#v}" --notes-file notes.md --generate-notes
          fi
