<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCP Browser</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="search" type="application/opensearchdescription+xml" title="MCP Browser" href="/opensearch.xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="chrome">
    <div class="tabstrip" role="tablist" id="tabstrip">
      <button class="tab-new" id="newTab" title="New tab (Ctrl+T)" aria-label="New tab">+</button>
    </div>
    <div class="toolbar">
      <button class="icon-btn" id="back" title="Back" aria-label="Back">&#8592;</button>
      <button class="icon-btn" id="fwd" title="Forward" aria-label="Forward">&#8594;</button>
      <button class="icon-btn" id="reload" title="Search again" aria-label="Search again">&#8635;</button>
      <button class="icon-btn" id="home" title="Home (⌘/Ctrl+Shift+H)" aria-label="Home"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg></button>
      <form class="omnibox" id="omnibox" autocomplete="off">
        <input id="omni" type="text" spellcheck="false" placeholder="Ask anything, or type a web address" aria-label="Search or address">
      </form>
      <button class="mode-chip" id="modeChip" title="Answer engine"></button>
      <button class="icon-btn menu-btn" id="menuBtn" title="Menu" aria-label="Menu" aria-expanded="false" aria-controls="menuPanel">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="4" cy="10" r="1.7"/><circle cx="10" cy="10" r="1.7"/><circle cx="16" cy="10" r="1.7"/></svg>
      </button>
      <nav class="menu-panel" id="menuPanel" hidden>
        <button type="button" data-go="mcp://watches">Watches</button>
        <button type="button" data-go="mcp://check">Cross-check a claim</button>
        <button type="button" data-go="mcp://deps">Dependency check</button>
        <button type="button" data-go="mcp://rank">MCP Rank</button>
        <button type="button" data-go="mcp://servers">MCP servers</button>
        <button type="button" data-go="mcp://catalog">Server catalog</button>
        <button type="button" data-go="mcp://stack">My MCP stack</button>
        <button type="button" data-go="mcp://webmcp">Websites with AI tools</button>
        <button type="button" data-go="mcp://pipelines">Pipelines</button>
        <button type="button" data-go="mcp://audit">My installed servers</button>
        <button type="button" data-go="mcp://settings">Settings</button>
      </nav>
      <button class="icon-btn has-badge" id="openWatches" title="Watches" aria-label="Watches">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M10 4.5C5.8 4.5 3 10 3 10s2.8 5.5 7 5.5 7-5.5 7-5.5-2.8-5.5-7-5.5Z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="2.3"/></svg>
        <span class="badge-dot" id="watchBadge" hidden></span>
      </button>
      <button class="icon-btn" id="openRank" title="MCP Rank" aria-label="MCP Rank">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="2" y="11" width="4" height="7" rx="1"/><rect x="8" y="4" width="4" height="14" rx="1"/><rect x="14" y="8" width="4" height="10" rx="1"/></svg>
      </button>
      <button class="icon-btn" id="openServers" title="MCP servers" aria-label="MCP servers">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="4" cy="10" r="2.2"/><circle cx="16" cy="4" r="2.2"/><circle cx="16" cy="16" r="2.2"/><path d="M6 10h4m0 0 4-5m-4 5 4 5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <button class="icon-btn" id="openCatalog" title="Server catalog" aria-label="Server catalog">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="2.5" y="2.5" width="6" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="11.5" y="2.5" width="6" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="2.5" y="11.5" width="6" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="11.5" y="11.5" width="6" height="6" rx="1.2"/></svg>
      </button>
      <button class="icon-btn" id="openStack" title="My MCP stack" aria-label="My MCP stack">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M10 2.5 2.5 6.5 10 10.5l7.5-4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="m2.5 10 7.5 4 7.5-4M2.5 13.5l7.5 4 7.5-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="openSettings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M10 6.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 1.5v2.2M10 16.3v2.2M1.5 10h2.2M16.3 10h2.2M4 4l1.6 1.6M14.4 14.4 16 16M4 16l1.6-1.6M14.4 5.6 16 4" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
  </div>
  <main id="pages"></main>

  <template id="tpl-home">
    <section class="page home">
      <div class="home-inner">
        <h1 class="wordmark"><span class="wm-mark" aria-hidden="true"></span>MCP Browser</h1>
        <p class="home-sub" data-stats>Answers from the open network of MCP servers.</p>
        <form class="home-search" data-home-form>
          <input type="text" data-home-input placeholder="What do you want to know?" aria-label="Search">
          <button type="submit">Search</button>
        </form>
        <div class="suggest" data-suggest></div>
        <nav class="home-tools" aria-label="More than search">
          <button type="button" data-home-tool="para"><b>Fact-check a paragraph</b><span>Paste an AI answer: each fact against independent sources</span></button>
          <button type="button" data-home-tool="deps"><b>Check a project’s dependencies</b><span>A lockfile or a GitHub link, against two vulnerability databases</span></button>
          <button type="button" data-home-tool="watch"><b>Tell me when…</b><span>A price, a release or a page you care about, watched for you</span></button>
        </nav>
        <section class="today" data-today hidden></section>
        <div class="recent" data-recent hidden><span class="recent-l">Recent</span><div class="recent-list" data-recent-list></div><button type="button" class="link-btn" data-recent-clear>Clear</button></div>
        <section class="setup" data-setup hidden>
          <div class="setup-head">
            <h2>Get one written answer with citations</h2>
            <button type="button" class="setup-toggle" data-setup-toggle aria-expanded="false">Set up</button>
            <button type="button" class="setup-close" data-setup-close aria-label="Hide">×</button>
          </div>
          <div class="setup-body" data-setup-body hidden>
          <p>Free mode shows each server's results. Add an AI model to get one answer that cites them:</p>
          <div class="setup-opts">
            <div class="setup-opt wide">
              <h3>Use your Claude subscription</h3>
              <p>Run MCP Browser inside Claude Desktop or Claude Code. Claude does the thinking; MCP Browser gives it the servers.</p>
              <div class="setup-two">
                <div>
                  <p class="setup-label">Claude Code: run in a terminal</p>
                  <div class="copyline"><code data-cc-cmd></code><button type="button" data-copy="cc">Copy</button></div>
                </div>
                <div>
                  <p class="setup-label">Claude Desktop: Settings → Developer → Edit config</p>
                  <div class="copyline"><pre data-cd-json></pre><button type="button" data-copy="cd">Copy</button></div>
                </div>
              </div>
            </div>
            <div class="setup-opt">
              <h3>Add an API key</h3>
              <p>Anthropic (Claude), OpenAI, Groq, OpenRouter or any OpenAI-compatible service. Answers appear right here in the browser.</p>
              <button type="button" class="setup-btn" data-open-settings>Open Settings</button>
            </div>
            <div class="setup-opt">
              <h3>Free and private with Ollama</h3>
              <p>Install <a href="https://ollama.com" target="_blank" rel="noopener noreferrer">Ollama</a>, then run:</p>
              <div class="copyline"><code>ollama pull qwen3:8b</code><button type="button" data-copy="ollama">Copy</button></div>
              <button type="button" class="setup-btn" data-use-ollama>Use Ollama</button>
              <span class="setup-msg" data-ollama-msg></span>
            </div>
          </div>
          </div>
        </section>
        <section class="discover" data-discover hidden>
          <div class="dc-col">
            <h2>Ask a server directly</h2>
            <p class="dc-lede">Well-known servers that answer without a key. Click a question to run it.</p>
            <ul class="dc-list" data-dc-try></ul>
          </div>
          <div class="dc-col">
            <h2 data-dc-local-h hidden>Run on your Mac (tested)</h2>
            <ul class="dc-list" data-dc-local></ul>
            <h2>New this week</h2>
            <ul class="dc-list" data-dc-fresh></ul>
            <h2>Most downloaded this month</h2>
            <ul class="dc-list dc-plain" data-dc-popular></ul>
          </div>
          <nav class="dc-more" aria-label="Explore">
            <button type="button" data-go="mcp://catalog" data-dc-n="servers">Server catalog</button>
            <button type="button" data-go="mcp://pipelines" data-dc-n="pipelines">Pipelines</button>
            <button type="button" data-go="mcp://webmcp" data-dc-n="sites">Websites with AI tools</button>
            <button type="button" data-go="mcp://check">Cross-check a claim</button>
            <button type="button" data-go="mcp://deps">Dependency check</button>
            <button type="button" data-go="mcp://stack">My MCP stack</button>
          </nav>
        </section>
        <section class="se-card" data-se hidden>
          <div class="se-head"><h2>Make it your search engine</h2><button type="button" class="setup-close" data-se-close aria-label="Hide">×</button></div>
          <p>Searches from your browser’s address bar come here first. Add a search engine in your browser with this address:</p>
          <div class="copyline"><code data-se-url></code><button type="button" data-se-copy>Copy</button></div>
          <p class="hint">Chrome, Edge, Brave and Arc: Settings → Search engine → Manage search engines → Add (or “Site search” → Add), then make it the default. Firefox: right-click the address bar on this page → Add “MCP Browser”. Type <code>!g</code>, <code>!w</code>, <code>!yt</code>, <code>!maps</code> and more in any search to jump to that site.</p>
        </section>
        <details class="templates-wrap">
          <summary>Research templates</summary>
        <section class="templates" data-templates hidden>
          <h2>Templates</h2>
          <div class="tpl-groups" data-tpl-list></div>
          <form class="tpl-form" data-tpl-form hidden>
            <h3 data-tpl-title></h3>
            <p data-tpl-desc></p>
            <div data-tpl-fields></div>
            <p class="hint" data-tpl-note></p>
            <div class="tpl-actions"><button type="submit">Run template</button> <button type="button" data-tpl-cancel>Cancel</button></div>
          </form>
        </section>
        </details>
      </div>
    </section>
  </template>

  <template id="tpl-search">
    <section class="page search">
      <div class="thread" data-thread></div>
      <form class="followup" data-followup>
        <input type="text" placeholder="Ask a follow-up" aria-label="Follow-up question">
        <button type="submit">Ask</button>
      </form>
    </section>
  </template>

  <template id="tpl-turn">
    <article class="turn">
      <div class="q-row">
        <h2 class="q" data-q></h2>
        <form class="watch-form" data-watch-form>
          <button type="button" class="watch-btn" data-copy-md title="Copy the question, answer and sources as Markdown">Copy</button>
          <button type="button" class="watch-btn" data-watch-toggle>Watch</button>
          <span class="watch-pick" data-watch-pick hidden>
            <label class="sr-only" for="watch-every">How often</label>
            <select data-watch-every aria-label="How often">
              <option value="hourly">Every hour</option>
              <option value="daily" selected>Every day</option>
              <option value="weekly">Every week</option>
            </select>
            <button type="submit" class="watch-save">Save</button>
          </span>
          <span class="watch-done" data-watch-done hidden></span>
        </form>
      </div>
      <p class="elsewhere" data-elsewhere></p>
      <p class="advice-note" data-advice-note hidden></p>
      <p class="board-summary" data-board-summary hidden></p>
      <div class="switchboard" data-switchboard aria-label="Servers consulted"></div>
      <div class="turn-body">
        <div class="answer-col">
          <div class="notice" data-notice hidden></div>
          <div class="answer md" data-answer><p class="placeholder">Finding the right servers…</p></div>
          <section class="acard" data-card hidden aria-live="polite"></section>
          <div class="direct" data-direct></div>
          <div class="direct-extra" data-direct-extra></div>
          <p class="deeper" data-deeper hidden></p>
          <details class="activity" data-activity-wrap>
            <summary>Activity <span data-activity-count></span></summary>
            <ol class="activity-list" data-activity></ol>
          </details>
        </div>
        <aside class="sources" data-sources-wrap hidden>
          <h3>Sources</h3>
          <ol data-sources></ol>
        </aside>
      </div>
    </article>
  </template>

  <template id="tpl-servers">
    <section class="page panel servers">
      <header class="panel-head">
        <h1>MCP servers</h1>
        <p class="panel-lede">The browser picks a few of these for every question. Curated servers are on by default. Turn on discovery to also use community servers from the official MCP Registry.</p>
      </header>
      <div class="registry-bar">
        <div data-registry-status>Registry not downloaded yet.</div>
        <div class="registry-actions">
          <label class="switch"><input type="checkbox" data-discovery><span>Discovery</span></label>
          <button data-sync>Update registry</button>
        </div>
      </div>
      <details class="add-server">
        <summary>Add a server by URL</summary>
        <form data-add-server>
          <p class="hint">Any MCP endpoint that speaks Streamable HTTP or SSE, including your company's own or one on this computer (for example http://localhost:3000/mcp). If it needs a key, add it after with Add key.</p>
          <label>URL <input name="url" type="url" required placeholder="https://mcp.example.com/mcp"></label>
          <label>Name <input name="title" placeholder="e.g. Acme internal docs"></label>
          <label>What it's for <input name="description" placeholder="Helps routing pick it, e.g. 'Acme product docs and support tickets'"></label>
          <div><button type="submit">Add server</button> <span class="add-msg" data-add-msg></span></div>
        </form>
      </details>
      <div class="server-filters">
        <input type="search" data-server-q placeholder="Search servers by topic, e.g. weather, papers, flights" aria-label="Search servers">
        <select data-server-source aria-label="Filter">
          <option value="all">All</option>
          <option value="enabled">Enabled</option>
          <option value="curated">Curated</option>
          <option value="registry">Registry</option>
          <option value="custom">Added by you</option>
        </select>
        <select data-server-sort aria-label="Sort">
          <option value="">Best match</option>
          <option value="stars">Most GitHub stars</option>
          <option value="updated">Recently updated</option>
          <option value="pushed">Recent GitHub activity</option>
          <option value="oldest">Oldest update first</option>
        </select>
        <select data-server-since aria-label="Updated within">
          <option value="">Any time</option>
          <option value="1">Updated in the last day</option>
          <option value="7">Last 7 days</option>
          <option value="30">Last 30 days</option>
          <option value="90">Last 90 days</option>
          <option value="365">Last 12 months</option>
        </select>
      </div>
      <p class="route-preview" data-route-preview></p>
      <ul class="server-list" data-server-list></ul>
      <button class="more" data-more hidden>Show more</button>
    </section>
  </template>

  <template id="tpl-watches">
    <section class="page panel watches">
      <header class="panel-head">
        <h1>Watches</h1>
        <p class="panel-lede">Saved searches that run again on a schedule while MCP Browser is open, and tell you when something changed: new sources, a different answer, a price crossing your line, or the news you were waiting for. They run on your computer; nothing is sent to an account.</p>
      </header>
      <form class="tw-form" data-tw-form>
        <input type="text" data-tw-text placeholder="Tell me when NVDA drops below 200" aria-label="Tell me when" maxlength="300">
        <button type="submit" class="st-dl-btn">Set it up</button>
      </form>
      <div class="tw-examples" data-tw-examples></div>
      <div class="tw-preview" data-tw-preview hidden></div>
      <ul class="watch-list" data-watch-list></ul>
    </section>
  </template>

  <template id="tpl-rank">
    <section class="page panel rank">
      <header class="panel-head">
        <h1>MCP Rank</h1>
        <p class="panel-lede">Servers ranked by what they actually do. Each one is asked questions with known answers; the score also counts whether it's free, honest (no ads or instructions hidden in results), safe, fast and well described. Better-ranked servers are preferred when routing.</p>
      </header>
      <div class="rank-bar">
        <div class="rank-tabs" role="tablist" data-rank-tabs></div>
        <div class="rank-run"><span data-rank-status></span><button data-rank-run>Run tests</button></div>
      </div>
      <p class="hint" data-rank-meta></p>
      <ol class="rank-list" data-rank-list></ol>
    </section>
  </template>

  <template id="tpl-catalog">
    <section class="page panel catalog">
      <header class="panel-head">
        <h1>Server catalog</h1>
        <p class="panel-lede" data-cat-lede>Loading the catalog…</p>
      </header>
      <div class="cat-views" role="tablist" aria-label="Catalog views">
        <button type="button" role="tab" data-view="uses" aria-selected="true">Use cases</button>
        <button type="button" role="tab" data-view="all" aria-selected="false">All servers</button>
      </div>
      <div class="u-wrap" data-cat-uses>
        <form class="u-ask" data-u-form>
          <label for="u-q">What do you want to do?</label>
          <div class="u-ask-row"><input id="u-q" type="search" data-u-q placeholder="e.g. track competitor pricing, summarize my unread email, find papers on sleep" autocomplete="off"><button type="submit">Find servers</button></div>
          <p class="u-mine"><button type="button" class="link-btn" data-open="mcp://audit">Check the servers you already have installed</button> (Claude, Cursor, VS Code)</p>
          <p class="u-examples">Try: <button type="button" data-u-example>triage production errors</button> <button type="button" data-u-example>research a stock before earnings</button> <button type="button" data-u-example>plan a trip to Lisbon</button> <button type="button" data-u-example>query our postgres database</button></p>
        </form>
        <div data-u-plan></div>
        <div class="u-personas" data-u-personas role="group" aria-label="Who it’s for"></div>
        <h2 class="u-h">Goals</h2>
        <div class="u-grid" data-u-goals></div>
        <h2 class="u-h" data-u-flows-head>Workflows that chain servers</h2>
        <div class="u-grid" data-u-flows></div>
      </div>
      <div data-cat-all hidden>
      <div class="cat-spectrum" data-cat-spectrum role="group" aria-label="Servers by category"></div>
      <p class="cat-speckey" data-cat-speckey></p>
      <div class="cat-timeline">
        <div class="cat-timeline-head"><span>Servers added to the registry each month. Pick a month to see only those.</span><span data-cat-monthnote></span></div>
        <div class="cat-months" data-cat-months role="group" aria-label="Servers added per month"></div>
        <div class="cat-axis" data-cat-axis aria-hidden="true"></div>
      </div>
      <div class="cat-controls">
        <input type="search" data-cat-q placeholder="Search servers: postgres, weather, github, stripe…" aria-label="Search the catalog" autocomplete="off">
        <select data-cat-sort aria-label="Sort by">
          <option value="pop">Most popular</option>
          <option value="stars">Most GitHub stars</option>
          <option value="dl">Most downloads</option>
          <option value="rank">MCP Rank score</option>
          <option value="added">Newest in registry</option>
          <option value="new">Latest release</option>
          <option value="pushed">Latest GitHub activity</option>
          <option value="oldest">Oldest in registry</option>
          <option value="name">Name A–Z</option>
        </select>
        <div class="cat-chips" role="group" aria-label="Filters">
          <button type="button" data-cat-filter="remote" aria-pressed="false">Hosted URL</button>
          <button type="button" data-cat-filter="pkg" aria-pressed="false">Installable package</button>
          <button type="button" data-cat-filter="gh" aria-pressed="false">On GitHub</button>
          <button type="button" data-cat-filter="free" aria-pressed="false">Works without a key</button>
          <button type="button" data-cat-filter="rank" aria-pressed="false">Tested by MCP Rank</button>
          <button type="button" data-cat-filter="works" aria-pressed="false">Tested working</button>
          <button type="button" data-cat-filter="noenv" aria-pressed="false">No setup required</button>
          <button type="button" data-cat-filter="bulk" aria-pressed="false">Hide bulk publishers</button>
        </div>
        <div class="cat-time" role="group" aria-label="Time period">
          <select data-cat-datefield aria-label="Which date">
            <option value="added">Added to registry</option>
            <option value="updated">Latest release</option>
            <option value="pushed">Last GitHub push</option>
          </select>
          <select data-cat-period aria-label="Time period">
            <option value="any">Any time</option>
            <option value="1">Last 24 hours</option>
            <option value="7">Last 7 days</option>
            <option value="30">Last 30 days</option>
            <option value="90">Last 90 days</option>
            <option value="365">Last 12 months</option>
            <option value="custom">Custom range</option>
          </select>
          <span data-cat-range hidden><label>From <input type="date" data-cat-from></label> <label>to <input type="date" data-cat-to></label></span>
          <button type="button" class="link-btn" data-cat-clear hidden>Clear dates</button>
        </div>
      </div>
      <div class="cat-body">
        <nav class="cat-rail" aria-label="Categories"><ul data-cat-cats></ul></nav>
        <div class="cat-results">
          <div class="cat-head"><strong data-cat-count>Loading…</strong><span data-cat-note></span></div>
          <ul class="cat-list" data-cat-list></ul>
          <button type="button" class="more" data-cat-more hidden>Show more</button>
        </div>
      </div>
      </div>
      <p class="hint">From the official MCP Registry. Stars from the open GitHub indexes (ecosyste.ms, ungh); downloads from npm and PyPI (last 30 days), crates.io (90 days) and Docker Hub (all-time). Categories come from each server's title and description, so a few are off. Rebuild with <code>npm run catalog</code>.</p>
    </section>
  </template>

  <template id="tpl-webmcp">
    <section class="page panel webmcp">
      <header class="panel-head">
        <h1>Websites with AI tools</h1>
        <p class="panel-lede">Sites whose pages offer tools that AI agents can call directly, through the new WebMCP web standard: search a shop, check availability, fill in a booking. From the webmcp.com directory, run by nekuda.ai. Open a site in a tab and MCP Browser picks up its tools from the page.</p>
        <p class="wm-desk hint" data-wm-desk hidden>Using a page’s tools needs the MCP Browser desktop app (<code>npm run desktop</code>). Here, Open takes you to the site in your browser.</p>
      </header>
      <div class="wm-filters">
        <input type="search" data-wm-q placeholder="Search sites and tools, e.g. flights, recipes, support" aria-label="Search sites and tools">
        <div class="wm-kinds-f cat-chips" role="group" aria-label="What the tools do">
          <button type="button" data-wm-kind="" aria-pressed="true">All</button>
          <button type="button" data-wm-kind="answer" aria-pressed="false">Answer questions</button>
          <button type="button" data-wm-kind="act" aria-pressed="false">Act on the page</button>
          <button type="button" data-wm-kind="transact" aria-pressed="false">Buy or book</button>
        </div>
        <select data-wm-cat aria-label="Category"><option value="">All categories</option></select>
      </div>
      <p class="a-sum" data-wm-sum></p>
      <ul class="wm-list" data-wm-list></ul>
      <p><button type="button" class="la-btn" data-wm-more hidden>Show more</button></p>
    </section>
  </template>

  <template id="tpl-check">
    <section class="page panel check">
      <header class="panel-head">
        <h1>Cross-check</h1>
        <p class="panel-lede">Is it true? Your claim goes to web search, Wikipedia and specialist servers, and each source’s own sentence is shown: the ones that say the same, the ones that give a different figure or name, and the ones that only mention it.</p>
      </header>
      <form class="ck-form" data-ck-form>
        <input type="text" data-ck-claim placeholder="A claim, e.g. The Eiffel Tower is 330 meters tall" aria-label="Claim to check" maxlength="300">
        <button type="submit" class="st-dl-btn">Check</button>
      </form>
      <div class="ck-examples" data-ck-examples></div>
      <details class="pc-box" data-pc-box>
        <summary>Check a whole paragraph</summary>
        <form class="pc-form" data-pc-form>
          <textarea data-pc-text rows="5" maxlength="4000" aria-label="Paragraph to check" placeholder="Paste an AI answer or a few sentences from an article. Each plain fact in it (who did what, a figure, a year) is checked on its own; opinions and questions are left out."></textarea>
          <div class="dp-acts"><button type="submit" class="st-dl-btn">Check each fact</button><span>Try <button type="button" class="link-btn" data-pc-ex>an AI answer with two mistakes</button></span></div>
        </form>
      </details>
      <div class="ck-out" data-ck-out></div>
    </section>
  </template>

  <template id="tpl-deps">
    <section class="page panel deps">
      <header class="panel-head">
        <h1>Dependency check</h1>
        <p class="panel-lede">Paste a package.json, a requirements.txt, a lockfile, one package per line, or a link to a public GitHub repo. Two services reading OSV.dev, from different publishers, say which versions have known vulnerabilities, side by side, and a registry service says what’s latest and whether it’s still maintained.</p>
        <p class="hint">Package names and versions (nothing else) go to three community servers: osv-advisory.caseyjhand.com, security.datakoot.com and package.datakoot.com. Leave out private package names you don’t want them to see. A GitHub link is read through pagefetch.openkrill.app.</p>
      </header>
      <form class="dp-form" data-dp-form>
        <textarea data-dp-text rows="8" spellcheck="false" aria-label="Packages to check" placeholder='{ "dependencies": { "lodash": "^4.17.15" } }&#10;or&#10;requests==2.19.0&#10;or&#10;lodash@4.17.15&#10;or&#10;https://github.com/expressjs/express'></textarea>
        <div class="dp-acts"><button type="submit" class="st-dl-btn">Check packages</button><label class="link-btn dp-file">Choose a file<input type="file" data-dp-file class="sr-only" accept=".json,.lock,.txt,.toml,.yaml,.yml,text/plain,application/json"></label><span>Try <button type="button" class="link-btn" data-dp-ex="npm">a package.json</button> or <button type="button" class="link-btn" data-dp-ex="py">a requirements.txt</button></span></div>
      </form>
      <div class="dp-out" data-dp-out></div>
    </section>
  </template>

  <template id="tpl-pipelines">
    <section class="page panel pipelines">
      <header class="panel-head">
        <h1>Pipelines</h1>
        <p class="panel-lede">MCP servers working together. Each step asks a server something, and can use what the step before found: run once for each paper, headline or repo it returned, or pass its answer on. Put one on a schedule and it can keep going until the result says what you’re waiting for.</p>
        <p><button type="button" class="la-btn" data-pl-new>New pipeline</button> <a class="pl-guide" href="https://github.com/KrishnaMaddireddy/mcp-browser/blob/main/docs/pipelines.md" target="_blank" rel="noopener noreferrer">How to build one</a></p>
      </header>
      <div data-pl-edhost></div>
      <ul class="pl-list" data-pl-temp></ul>
      <h2 class="pl-h" data-pl-mine-h hidden>Your pipelines</h2>
      <ul class="pl-list" data-pl-mine></ul>
      <h2 class="pl-h" data-pl-lib-h>Ready to run</h2>
      <div class="pl-filter">
        <input type="search" data-pl-find placeholder="Find a pipeline: stocks, recipes, CVE, papers…" aria-label="Find a pipeline">
        <div class="pl-topics" data-pl-topics role="group" aria-label="Topics"></div>
      </div>
      <ul class="pl-list pl-lib" data-pl-starters></ul>
      <p class="pl-more-wrap"><button type="button" class="la-btn" data-pl-more hidden>Show more</button></p>
    </section>
  </template>

  <template id="tpl-stack">
    <section class="page panel stack">
      <header class="panel-head">
        <h1>My MCP stack</h1>
        <p class="panel-lede">The MCP servers you picked from the catalog: what each needs, whether it’s installed, and prompts to try. Fill in their keys and set them all up in Claude, Cursor or VS Code from here.</p>
      </header>
      <p class="a-sum" data-st-sum></p>
      <ul class="st-list" data-st-list></ul>
      <div data-st-setup></div>
    </section>
  </template>

  <template id="tpl-audit">
    <section class="page panel audit">
      <header class="panel-head">
        <h1>My installed servers</h1>
        <p class="panel-lede">The MCP servers set up in Claude Desktop, Claude Code, Cursor, VS Code and Windsurf on this computer, matched to the official registry and checked for risks: keys in plain text, unknown publishers, unpinned versions, archived or abandoned code, tools that change things. Read-only: nothing is changed or sent anywhere.</p>
      </header>
      <p class="a-sum" data-audit-sum></p>
      <ul class="a-list" data-audit-list></ul>
      <details class="a-files"><summary>Files checked</summary><ul data-audit-files></ul></details>
      <p><button type="button" class="link-btn" data-audit-again>Check again</button></p>
    </section>
  </template>

  <template id="tpl-settings">
    <section class="page panel settings">
      <header class="panel-head">
        <h1>Settings</h1>
        <p class="panel-lede">Without an AI model the browser runs in free mode: it asks each server directly and shows readable results with a quick answer when one sentence answers the question. Add a model for one written answer with citations.</p>
      </header>
      <form data-settings-form class="settings-form">
        <fieldset>
          <legend>Answer engine</legend>
          <label>Provider
            <select name="provider">
              <option value="auto">Automatic</option>
              <option value="anthropic">Anthropic (Claude)</option>
              <option value="openai">OpenAI-compatible (OpenAI, Groq, OpenRouter, Ollama…)</option>
              <option value="none">None — free mode</option>
            </select>
          </label>
          <label>Model <input name="model" placeholder="Default for the provider"></label>
          <label>API key <input name="apiKey" type="password" autocomplete="off" placeholder="Stored only on this computer"></label>
          <label>Base URL <input name="baseUrl" placeholder="Only for OpenAI-compatible, e.g. http://localhost:11434/v1"></label>
          <p class="hint" data-provider-state></p>
        </fieldset>
        <fieldset>
          <legend>Routing</legend>
          <div class="depth" role="radiogroup" aria-label="Search depth" data-depth>
            <label><input type="radio" name="depth" value="fast"><span class="depth-text"><b>Fast</b><span>Vetted servers only (up to 4). Quickest, fewest surprises.</span></span></label>
            <label><input type="radio" name="depth" value="balanced"><span class="depth-text"><b>Balanced</b><span>Adds the best-matching community servers (up to 8, 4 from the registry).</span></span></label>
            <label><input type="radio" name="depth" value="wide"><span class="depth-text"><b>Wide</b><span>Casts a big net (up to 20, 14 from the registry). Slower, more noise.</span></span></label>
          </div>
          <p class="hint" data-depth-custom hidden>Your numbers below don't match a preset.</p>
          <label class="check"><input name="answerCards" type="checkbox"> Answer cards: when you type one company, city, website or vulnerability, also ask a few vetted servers about it (servers you switch off are skipped)</label>
          <details class="advanced"><summary>Advanced</summary>
          <label>Servers per question <input name="maxServers" type="number" min="1" max="100"></label>
          <label>Tools offered to the AI per question <input name="maxToolsPerQuery" type="number" min="4" max="512"></label>
          <label>Tool rounds per answer <input name="maxSteps" type="number" min="1" max="50"></label>
          <label class="check"><input name="alwaysWebSearch" type="checkbox"> Always include web search</label>
          <label class="check"><input name="semanticRouting" type="checkbox"> Match servers by meaning, not just keywords (local model)</label>
          <label class="check"><input name="discovery" type="checkbox"> Discovery: use community servers from the registry</label>
          <label>Community servers per question <input name="discoveryMax" type="number" min="0" max="100"></label>
          <p class="hint">Community servers count inside "Servers per question". Only servers that clearly match a question are used, so a high limit is a ceiling, not a target. Large numbers make answers slower and send your question to more strangers' servers.</p>
          <label>Tool timeout (ms) <input name="toolTimeoutMs" type="number" min="2000" max="600000" step="1000"></label>
          <label>Free-mode page budget (ms) <input name="freeModeBudgetMs" type="number" min="3000" max="120000" step="1000"></label>
          </details>
        </fieldset>
        <fieldset>
          <legend>Start page</legend>
          <label class="check"><input type="checkbox" data-today-show> Show Today: your weather, the market, today’s headlines and topics you follow (your city and topics stay in this browser)</label>
        </fieldset>
        <fieldset>
          <legend>GitHub stars</legend>
          <p class="hint">Stars show how popular a server's code is. They are shown next to MCP Rank scores but never change them: popular isn't the same as accurate.</p>
          <label>GitHub token <input name="githubToken" type="password" autocomplete="off" placeholder="Optional: refreshes every repo in a few minutes"></label>
          <p class="hint">A fine-grained token with no permissions is enough (github.com → Settings → Developer settings). Without one, stars come from ecosyste.ms open data, 1,000 repos per refresh.</p>
          <div><button type="button" data-stars-refresh>Refresh stars</button> <span class="hint" data-stars-state></span></div>
        </fieldset>
        <div class="form-actions"><button type="submit">Save settings</button><span data-saved class="saved" hidden>Saved</span></div>
      </form>
    </section>
  </template>

  <script src="markdown.js"></script>
  <script src="use-cases.js"></script>
  <script src="catalog-guide.js"></script>
  <script src="catalog-usecases.js"></script>
  <script src="catalog.js"></script>
  <script src="audit.js"></script>
  <script src="local-run.js"></script>
  <script src="stack.js"></script>
  <script src="bangs.js"></script>
  <script src="pipelines.js"></script>
  <script src="check.js"></script>
  <script src="deps.js"></script>
  <script src="page-tools.js"></script>
  <script src="webmcp-sites.js"></script>
  <script src="link-actions.js"></script>
  <script src="app.js"></script>
</body>
